<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Leave">
<meta name="robots" content="noindex,nofollow"><title>Leave</title>
<style>
:root{color-scheme:dark}
body{margin:0;font:17px -apple-system,system-ui,sans-serif;background:#0d0f12;color:#e8eaed;padding:env(safe-area-inset-top) 18px 30px}
.tabs{display:flex;gap:8px;margin:18px 0 22px}
.tabs button{flex:1;padding:14px;border:0;border-radius:12px;background:#1d2127;color:#aab;font-size:18px;font-weight:600}
.tabs button.on{background:#d93a2b;color:#fff}
.big{font-size:64px;font-weight:800;line-height:1;margin:6px 0}
.sub{color:#9aa3ad;font-size:16px;margin-bottom:6px}
.card{background:#16191e;border-radius:16px;padding:18px;margin-bottom:14px}
.leg{margin:8px 0 0;font-size:16px}
.r{display:inline-block;background:#d93a2b;color:#fff;border-radius:6px;padding:1px 7px;font-weight:700;margin-right:6px}
.alt{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #23272e;font-size:16px}
.go{color:#3ddc84}.soon{color:#ffb020}
.foot{color:#5f6873;font-size:13px;text-align:center;margin-top:14px}
</style></head><body>
<div class="tabs"><button id="tg" onclick="setDir('gabby')">To Gabby's</button><button id="th" onclick="setDir('home')">Home</button></div>
<div id="out"><div class="sub">Loading live TTC times...</div></div>
<div class="foot" id="foot"></div>
<script>
const C={"cfg": {"gabby": {"door": 3.5, "options": [{"name": "510 north, then 506 east", "legs": [{"routes": ["510"], "board": [7353], "alight": [7347], "ride": 8, "walk0": {"7353": 5.6}, "after": {"7347": {"16862": 1.47, "843": 1.19}}}, {"routes": ["506"], "board": [16862, 843], "alight": [753], "ride": 13, "walk0": null, "after": {"753": 0.97}}]}, {"name": "510 north, then 505 east", "legs": [{"routes": ["510"], "board": [7353], "alight": [7349], "ride": 5, "walk0": {"7353": 5.6}, "after": {"7349": {"2189": 1.12}}}, {"routes": ["505"], "board": [2189], "alight": [2118], "ride": 12, "walk0": null, "after": {"2118": 9.11}}]}, {"name": "Walk to Dundas, 505 east", "legs": [{"routes": ["505"], "board": [2189], "alight": [2118], "ride": 12, "walk0": {"2189": 14.43}, "after": {"2118": 9.11}}]}, {"name": "504 east to Jarvis, walk up", "legs": [{"routes": ["504"], "board": [15649], "alight": [15636], "ride": 14, "walk0": {"15649": 0.82}, "after": {"15636": 21.51}}]}]}, "home": {"door": 4, "options": [{"name": "506 west, then 510 south", "legs": [{"routes": ["506"], "board": [754], "alight": [16861, 844], "ride": 13, "walk0": {"754": 1.31}, "after": {"16861": {"8120": 1.8}, "844": {"8120": 1.2}}}, {"routes": ["510"], "board": [8120], "alight": [8126], "ride": 8, "walk0": null, "after": {"8126": 5.37}}]}, {"name": "505 west, then 510 south", "legs": [{"routes": ["505"], "board": [2119], "alight": [2190], "ride": 12, "walk0": {"2119": 8.89}, "after": {"2190": {"8121": 1.08}}}, {"routes": ["510"], "board": [8121], "alight": [8126], "ride": 5, "walk0": null, "after": {"8126": 5.37}}]}, {"name": "505 west, walk down Spadina", "legs": [{"routes": ["505"], "board": [2119], "alight": [2190], "ride": 12, "walk0": {"2119": 8.89}, "after": {"2190": 15.01}}]}, {"name": "Walk to King, 504 west", "legs": [{"routes": ["504"], "board": [15635], "alight": [10176], "ride": 14, "walk0": {"15635": 21.32}, "after": {"10176": 1.21}}]}]}}, "names": {"15649": "King & Portland (eastbound)", "10176": "King & Portland (westbound)", "15636": "King & Jarvis (eastbound)", "15635": "King & Jarvis (westbound)", "7353": "Spadina & King (northbound)", "8126": "Spadina & King (southbound)", "7349": "Spadina & Dundas (northbound)", "8121": "Spadina & Dundas (southbound)", "7347": "Spadina & College (northbound)", "8120": "Spadina & College (southbound)", "843": "College & Spadina (eastbound)", "16862": "College & Spadina east side (eastbound)", "844": "College & Spadina (westbound)", "16861": "Spadina & College north side (westbound bus)", "753": "Carlton & Jarvis (eastbound)", "754": "Carlton & Jarvis (westbound)", "2189": "Dundas & Spadina (eastbound)", "2190": "Dundas & Spadina (westbound)", "2118": "Dundas & Jarvis (eastbound)", "2119": "Dundas & Jarvis (westbound)"}, "margin": 1, "xfer": 1};
const FEED=id=>`https://retro.umoiq.com/service/publicXMLFeed?command=predictions&a=ttc&stopId=${id}`;
let dir=localStorage.dir||'gabby', plans=[], fetchedAt=0;
function setDir(d){dir=localStorage.dir=d;plans=[];render();load();}
async function fetchStop(id){
  try{const t=await (await fetch(FEED(id),{cache:'no-store'})).text();
    const x=new DOMParser().parseFromString(t,'text/xml');const out=[];
    x.querySelectorAll('predictions').forEach(p=>p.querySelectorAll('prediction').forEach(q=>out.push({
      route:p.getAttribute('routeTag'),vehicle:q.getAttribute('vehicle'),t:+q.getAttribute('epochTime')/1000})));
    return out;}catch(e){return []}
}
async function load(){
  const d=C.cfg[dir], ids=new Set();
  d.options.forEach(o=>o.legs.forEach(l=>[...l.board,...l.alight].forEach(s=>ids.add(s))));
  const list=[...ids], res=await Promise.all(list.map(fetchStop)), P={};
  list.forEach((s,i)=>P[s]=res[i]);
  const now=Date.now()/1000, door=d.door*60, all=[];
  for(const o of d.options){
    const go=(i,ready,prevAlight,steps,leave)=>{
      const leg=o.legs[i];
      if(i===o.legs.length){all.push({opt:o.name,leave,arrive:ready+o.legs[i-1].after[prevAlight]*60,steps});return;}
      const seen=new Set();
      for(const b of leg.board){
        const w=(i===0?leg.walk0[b]:o.legs[i-1].after[prevAlight][b])*60;
        for(const v of P[b].filter(v=>leg.routes.includes(v.route)).sort((a,c)=>a.t-c.t)){
          if(seen.has(v.vehicle))continue;
          let lv=leave;
          if(i===0){lv=v.t-w-C.margin*60-door;if(lv<now)continue;}
          else if(v.t<ready+w+C.xfer*60)continue;
          seen.add(v.vehicle);
          let off=null,offStop=leg.alight[0];
          for(const a of leg.alight){const m=P[a].filter(x=>x.vehicle===v.vehicle&&x.t>v.t).map(x=>x.t);
            if(m.length){off=Math.min(...m);offStop=a;break;}}
          if(off===null)off=v.t+leg.ride*60;
          go(i+1,off,offStop,[...steps,{route:v.route,board:C.names[b],bt:v.t}],lv);
          if(i>0)break;
        }
      }
    };
    go(0,now,null,[],null);
  }
  let f=[];
  all.sort((a,b)=>b.leave-a.leave).forEach(p=>{if(!f.length||p.arrive<Math.min(...f.map(q=>q.arrive))-30)f.push(p)});
  f=f.filter(p=>!f.some(q=>q.arrive<p.arrive&&q.leave>=p.leave-90)).sort((a,b)=>a.leave-b.leave);
  plans=f;fetchedAt=Date.now();render();
}
const hm=t=>new Date(t*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'');
function render(){
  document.getElementById('tg').className=dir==='gabby'?'on':'';
  document.getElementById('th').className=dir==='home'?'on':'';
  const o=document.getElementById('out'), now=Date.now()/1000;
  const live=plans.filter(p=>p.leave>now-20);
  if(!live.length){o.innerHTML=fetchedAt?'<div class="sub">No live predictions right now. Retrying...</div>':'<div class="sub">Loading live TTC times...</div>';return;}
  const p=live[0], s=Math.max(0,Math.round(p.leave-now)), m=Math.floor(s/60), sec=s%60;
  const cls=s<=20?'go':s<=120?'soon':'';
  const txt=s<=20?'GO NOW':`${m}:${String(sec).padStart(2,'0')}`;
  let h=`<div class="card"><div class="sub">Leave in</div><div class="big ${cls}">${txt}</div>
   <div class="sub">Out the door ${hm(p.leave)} &middot; there ${hm(p.arrive)} (${Math.round((p.arrive-p.leave)/60)} min)</div>
   ${p.steps.map(x=>`<div class="leg"><span class="r">${x.route}</span>${x.board} &middot; ${hm(x.bt)}</div>`).join('')}</div>`;
  if(live.length>1)h+=`<div class="card"><div class="sub">Later options</div>${live.slice(1,4).map(q=>`<div class="alt"><span>Leave ${hm(q.leave)}</span><span>there ${hm(q.arrive)} &middot; ${q.steps.map(x=>x.route).join(' + ')}</span></div>`).join('')}</div>`;
  o.innerHTML=h;
  document.getElementById('foot').textContent=`Live TTC data, refreshed ${Math.round((Date.now()-fetchedAt)/1000)}s ago`;
}
setInterval(render,1000);setInterval(load,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();
</script></body></html>
